<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anees Mobile Guard — Remote Recovery</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#eef2ff}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#151f33;border:1px solid #26344f;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #405070;margin:5px 0}button{cursor:pointer;font-weight:700}#status{white-space:pre-wrap;color:#b9c7e6}.danger{background:#b42318;color:white}.primary{background:#2563eb;color:white}</style></head><body><div class="wrap"><h1>🛡️ Anees Mobile Guard</h1><p>Remote Lost Phone Recovery</p><div class="card"><h2>Pair your lost phone</h2><input id="device" placeholder="Device ID (AMG-...)"/><input id="code" placeholder="Pairing Code" type="password"/><button class="primary" onclick="status()">Check Status</button><div id="status">Not connected.</div></div><div class="card"><h2>Recovery Controls</h2><div class="grid"><button onclick="cmd('ACTIVATE_LOST_MODE')">Activate Lost Mode</button><button class="danger" onclick="cmd('PLAY_ALARM')">🔔 Ring / Alarm</button><button onclick="cmd('REQUEST_LOCATION')">📍 Request Location</button><button onclick="cmd('REQUEST_DEVICE_STATUS')">🔄 Refresh Status</button><button onclick="cmd('DEACTIVATE_LOST_MODE')">Deactivate Lost Mode</button></div><div id="result"></div></div></div><script src="firebase-config.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';const app=initializeApp(window.AMG_FIREBASE_CONFIG);const auth=getAuth(app);const fn=getFunctions(app);await signInAnonymously(auth);window.status=async()=>{const id=document.querySelector('#device').value.trim();if(!id)return;try{const r=await httpsCallable(fn,'getDeviceStatus')({deviceId:id,pairingSecret:document.querySelector('#code').value.trim()});document.querySelector('#status').textContent=JSON.stringify(r.data,null,2)}catch(e){document.querySelector('#status').textContent=e.message}};window.cmd=async(command)=>{const deviceId=document.querySelector('#device').value.trim(),pairingSecret=document.querySelector('#code').value.trim();if(!deviceId||!pairingSecret){document.querySelector('#result').textContent='Enter Device ID and Pairing Code.';return}try{const r=await httpsCallable(fn,'sendRemoteCommand')({deviceId,pairingSecret,command});document.querySelector('#result').textContent='Command sent successfully.';if(command==='REQUEST_DEVICE_STATUS')setTimeout(window.status,1200)}catch(e){document.querySelector('#result').textContent=e.message}};</script></body></html>
